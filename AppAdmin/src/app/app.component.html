<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content">
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>Panel Admin</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <ion-list>
          <ion-menu-toggle auto-hide="false">
            <ion-item routerDirection="root" [routerLink]="['/home']">
              <ion-icon slot="start" name="home-outline"></ion-icon>
              <ion-label>Inicio</ion-label>
            </ion-item>

            <ion-item routerDirection="root" [routerLink]="['/gestionusuarios']">
              <ion-icon slot="start" name="people-outline"></ion-icon>
              <ion-label>Gestión Usuarios</ion-label>
            </ion-item>

            <ion-item routerDirection="root" [routerLink]="['/gestiontrabajos']">
              <ion-icon slot="start" name="briefcase-outline"></ion-icon>
              <ion-label>Gestión Trabajos</ion-label>
            </ion-item>

            <ion-item routerDirection="root" [routerLink]="['/gestionfichajes']">
              <ion-icon slot="start" name="time-outline"></ion-icon>
              <ion-label>Gestión Fichajes</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
